[package]
name = "hardwave-workspace"
version = "0.2.8"
edition = "2021"

[lib]
name = "hardwave_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
dirs = "5"
futures-util = "0.3"
notify = "7"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }

# Files On-Demand (Windows only). Placeholders that appear full-size in Explorer
# but hold no data until something reads them. Proven to work unpackaged and
# unsigned on 2026-09-02.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Storage_CloudFilters",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  # CF_CALLBACK_INFO and CF_OPERATION_INFO both carry a *mut CORRELATION_VECTOR,
  # and windows-rs only emits an item when every namespace it touches is enabled.
  # Without this the whole callback half of the API silently does not exist.
  "Win32_System_CorrelationVector",
  "Win32_System_IO",
  # CreateFileW takes a SECURITY_ATTRIBUTES, so it is gated on this too.
  "Win32_Security",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
