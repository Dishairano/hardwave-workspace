[package]
name = "hardwave-workspace-installer"
version = "0.3.0"
edition = "2021"
description = "Hardwave Workspace custom installer"
publish = false

[lib]
name = "hardwave_workspace_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
zip = "2"
dirs = "5"
# The uninstaller checks a downloaded copy against its upload before deleting it.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
mslnk = "0.1"
