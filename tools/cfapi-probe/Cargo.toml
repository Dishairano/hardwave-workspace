[package]
name = "cfapi-probe"
version = "0.1.0"
edition = "2021"
publish = false

# Throwaway diagnostic. Answers one question before we commit to building
# Files On-Demand: can an UNPACKAGED desktop app register a cloud sync root and
# create a placeholder? Microsoft's overview page says sync engines are
# "designed to use the Desktop Bridge as an implementation requirement", but the
# CfRegisterSyncRoot reference lists no package-identity requirement. Rather
# than trust either, we ask Windows.

[dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Storage_CloudFilters",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
] }

[[bin]]
name = "cfapi-probe"
path = "src/main.rs"
