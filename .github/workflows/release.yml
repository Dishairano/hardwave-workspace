name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual builds for testing. No tag means no GitHub release is cut: the
  # installers are uploaded as run artefacts instead.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.target }}-cargo-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Set version from tag
        # Tag pushes only. On a manual run GITHUB_REF is a branch, so this would
        # write "refs/heads/main" into tauri.conf.json and the build fails with
        # "version must be a semver string". Keep the committed version instead.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cd src-tauri
          node -e "
            const fs = require('fs');
            let conf = fs.readFileSync('tauri.conf.json','utf8');
            conf = conf.replace(/\"version\": \"[^\"]*\"/, '\"version\": \"'+'$VERSION'+'\"');
            fs.writeFileSync('tauri.conf.json', conf);
            // The User-Agent the app sends carries the version too (workspace.hardwavestudios.com
            // reads it to tell the app from a browser).
            for (const f of ['tauri.windows.conf.json','tauri.macos.conf.json','tauri.linux.conf.json']) {
              fs.writeFileSync(f, fs.readFileSync(f,'utf8').replace(/HardwaveWorkspace\/[0-9][^" ]*/, 'HardwaveWorkspace/'+'$VERSION'));
            }
            let cargo = fs.readFileSync('Cargo.toml','utf8');
            cargo = cargo.replace(/^version = \"[^\"]*\"/m, 'version = \"'+'$VERSION'+'\"');
            fs.writeFileSync('Cargo.toml', cargo);
          "

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Azure Trusted Signing, the same way the DAW and the Suite sign: Tauri runs
          # scripts/sign-windows.ps1 on every file it bundles, before the updater signature is
          # taken. On a release tag a missing setting stops the build: nothing ships unsigned.
          # Without the settings a manual build is left unsigned and says so.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
        with:
          tagName: ${{ github.event_name == 'push' && 'v__VERSION__' || '' }}
          releaseName: 'Hardwave Workspace v__VERSION__'
          releaseBody: |
            Hardwave Workspace desktop app with auto file sync.

            Download the installer for your platform below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # The custom installer (the same four-screen setup app as the Suite, 2026-10-10 A2): it
      # downloads this zip from the release and unpacks it, so the zip is the payload and
      # HardwaveWorkspace-Setup.exe is what the site hands out.
      - name: Create portable Windows zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $staging = "staging/Hardwave Workspace"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $rawExe = Get-ChildItem -Path src-tauri/target/release -Filter "hardwave-workspace.exe" -File | Select-Object -First 1
          if (-not $rawExe) { throw "hardwave-workspace.exe not found in target/release" }
          Copy-Item $rawExe.FullName "$staging/Hardwave Workspace.exe"
          Get-ChildItem -Path src-tauri/target/release -Filter *.dll -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "$staging/"
          }
          if (Test-Path "src-tauri/target/release/resources") {
            Copy-Item "src-tauri/target/release/resources" "$staging/resources" -Recurse
          }
          Compress-Archive -Path "$staging/*" -DestinationPath "hardwave-workspace-portable-windows.zip" -Force
          Get-Item hardwave-workspace-portable-windows.zip | Select-Object Name,Length

      - name: Build the Workspace installer (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        working-directory: installer
        run: |
          npm install
          # Skip the Tauri bundler: the raw .exe is the installer, not another NSIS wrap.
          npm run tauri:build -- --no-bundle

      - name: Stage installer as HardwaveWorkspace-Setup.exe
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installerExe = Get-ChildItem -Path installer/src-tauri/target/release -Filter "hardwave-workspace-installer.exe" -File | Select-Object -First 1
          if (-not $installerExe) { throw "hardwave-workspace-installer.exe not found" }
          Copy-Item $installerExe.FullName "HardwaveWorkspace-Setup.exe"
          Get-Item HardwaveWorkspace-Setup.exe | Select-Object Name,Length

      # Built with --no-bundle, so Tauri's signing never sees it: signed here, with the same
      # script and the same rule (a release that cannot be signed stops).
      - name: Sign HardwaveWorkspace-Setup.exe
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: ./scripts/sign-windows.ps1 HardwaveWorkspace-Setup.exe

      - name: Upload the installer and the zip to the release
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" HardwaveWorkspace-Setup.exe hardwave-workspace-portable-windows.zip --clobber

      - name: Upload the installer (manual runs only)
        if: matrix.platform == 'windows-latest' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-setup-windows
          path: |
            HardwaveWorkspace-Setup.exe
            hardwave-workspace-portable-windows.zip

      - name: Upload installers (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ matrix.platform }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
          if-no-files-found: warn
